<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全聊天室 - 防SQL注入与XSS攻击</title>
    <!-- 添加 crypto-js 库用于AES解密 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #9e66ae 0%, #362886 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 登录/注册页面 */
        .auth-container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .auth-tab {
            font-size: 18px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            padding: 5px 15px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #1b2f86;
            border-bottom: 3px solid #1a37b8;
        }

        .auth-form {
            width: 100%;
            max-width: 300px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #364aa4;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #111d52;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #282f6a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        /* 聊天室页面 */
        .chat-container {
            display: none;
            height: 100%;
            flex-direction: row;
        }

        .chat-main {
            flex: 3;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid #e0e0e0;
        }

        .chat-sidebar {
            flex: 1;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px 15px;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        .chat-sidebar h3 {
            margin-bottom: 20px;
            color: #495057;
            font-size: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-sidebar h3::before {
            content: '👥';
            font-size: 18px;
        }

        .chat-sidebar ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .chat-sidebar li {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border-radius: 12px;
            color: #495057;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .chat-sidebar li:hover {
            transform: translateX(3px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        /* 在线状态指示器 */
        .chat-sidebar li::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
        }

        /* 当前用户特殊样式 */
        .chat-sidebar li.current-user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 500;
        }

        .chat-sidebar li.current-user::before {
            background: white;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        /* 用户名 */
        .chat-sidebar li .username {
            flex: 1;
        }

        /* 用户徽章 */
        .chat-sidebar li .user-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: auto;
        }

        /* 空状态样式 */
        .chat-sidebar .empty-state {
            color: #adb5bd;
            text-align: center;
            padding: 30px 15px;
            font-size: 13px;
            background: transparent;
            box-shadow: none;
            justify-content: center;
        }

        .chat-sidebar .empty-state:hover {
            transform: none;
            border-color: transparent;
        }

        .online-count {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 8px;
        }

        .chat-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-self {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }

        .message-self .message-content {
            background: #667eea;
            color: white;
        }

        .message-info {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .message-self .message-info {
            color: #ddd;
        }

        .message-text {
            word-break: break-word;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .input-container {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #5a67d8;
        }

        .online-status {
            font-size: 12px;
            color: #4ade80;
            margin-left: 10px;
        }

        /* 加密标识 */
        .encryption-badge {
            font-size: 10px;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录/注册页面 -->
        <div id="authContainer" class="auth-container">
            <div class="auth-tabs">
                <div id="loginTab" class="auth-tab active">登录</div>
                <div id="registerTab" class="auth-tab">注册</div>
            </div>
            
            <!-- 登录表单 -->
            <div id="loginForm" class="auth-form">
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="用户名 (3-20位)" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="密码 (6-20位)" autocomplete="new-password">
                </div>
                <button class="btn" onclick="handleLogin()">登录</button>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <input type="text" id="registerUsername" placeholder="用户名" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="密码" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <input type="password" id="registerConfirmPassword" placeholder="确认密码" autocomplete="new-password">
                </div>
                <button class="btn" onclick="handleRegister()">注册</button>
            </div>

            <div id="authError" class="error-message"></div>
        </div>

        <!-- 聊天室页面 -->
        <div id="chatContainer" class="chat-container">
            <!-- 左侧边栏：在线用户列表 -->
            <div class="chat-sidebar">
                <h3>
                    在线用户
                    <span class="online-count" id="onlineCount">0</span>
                </h3>
                <ul id="onlineUsers">
                    <li class="empty-state">✨ 暂无其他用户在线</li>
                </ul>
            </div>

            <!-- 右侧主聊天区 -->
            <div class="chat-main">
                <div class="chat-header">
                    <div>
                        <h2>安全聊天室 <span id="onlineStatus" class="online-status">● 在线</span></h2>
                        <span class="encryption-badge">🔒 AES加密</span>
                    </div>
                    <div class="user-info">
                        <span id="currentUser"></span>
                        <button class="logout-btn" onclick="handleLogout()">退出</button>
                    </div>
                </div>

                <div id="messages" class="messages-container">
                    <!-- 消息将使用textContent安全渲染 -->
                </div>

                <div class="input-container">
                    <input type="text" id="msgInput" placeholder="输入消息..." maxlength="1000">
                    <button class="send-btn" onclick="sendMessage()">发送</button>
                </div>
                <div id="chatError" class="error-message" style="padding: 0 20px 10px;"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // AES解密函数（与服务器端密钥保持一致）
        const SECRET_KEY = 'chat-room-secret-key-2026';

        function decryptMessage(encryptedText) {
            if (!encryptedText || typeof encryptedText !== 'string') return encryptedText;
            
            // 检查是否可能是密文（AES密文通常包含特定字符）
            if (!encryptedText.includes('U2FsdGVkX1')) {
                return encryptedText; // 不是密文，直接返回
            }
            
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedText, SECRET_KEY);
                const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                return decrypted || encryptedText; // 如果解密失败，返回原文
            } catch (e) {
                console.log('解密失败，显示原文:', e);
                return encryptedText;
            }
        }

        // 状态管理
        let currentUser = null;
        let socket = null;

        // 切换登录/注册标签
        document.getElementById('loginTab').addEventListener('click', () => {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            clearAuthError();
        });

        document.getElementById('registerTab').addEventListener('click', () => {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            clearAuthError();
        });

        // 清除错误信息
        function clearAuthError() {
            document.getElementById('authError').textContent = '';
        }

        // 显示错误信息
        function showAuthError(msg) {
            document.getElementById('authError').textContent = msg;
        }

        // 处理注册
        async function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (!username || !password || !confirmPassword) {
                showAuthError('请填写所有字段');
                return;
            }

            if (password !== confirmPassword) {
                showAuthError('两次输入的密码不一致');
                return;
            }

            if (password.length < 6 || password.length > 20) {
                showAuthError('密码长度必须在6-20位之间');
                return;
            }

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert('注册成功，请登录');
                    document.getElementById('loginTab').click();
                    document.getElementById('loginUsername').value = username;
                } else {
                    showAuthError(data.message);
                }
            } catch (error) {
                showAuthError('注册失败，请稍后重试');
            }
        }

        // 处理登录
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showAuthError('请填写用户名和密码');
                return;
            }

            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.data;
                    document.getElementById('currentUser').textContent = currentUser.username;
                    
                    // 登录成功后绑定WebSocket
                    socket.emit('bindUser', {
                        userId: currentUser.id,
                        username: currentUser.username
                    });
                    
                    showChatroom();
                    loadHistoryMessages();
                } else {
                    showAuthError(data.message);
                }
            } catch (error) {
                showAuthError('登录失败，请稍后重试');
            }
        }

        // 处理退出
        async function handleLogout() {
            try {
                await fetch('/api/users/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (socket) {
                    socket.close();
                }
                
                showAuth();
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
            } catch (error) {
                console.error('退出失败:', error);
            }
        }

        // 显示聊天室
        function showChatroom() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
        }

        // 显示登录页
        function showAuth() {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('chatContainer').style.display = 'none';
            currentUser = null;
        }

        // 初始化WebSocket
        function initWebSocket() {
            socket = io({
                transports: ['websocket'],
                reconnection: true,
                reconnectionAttempts: 10,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });

            socket.on('connect', () => {
                console.log('WebSocket连接成功');
                document.getElementById('chatError').textContent = '';
                
                // 如果已登录，重新绑定用户
                if (currentUser) {
                    socket.emit('bindUser', {
                        userId: currentUser.id,
                        username: currentUser.username
                    });
                }
            });

            socket.on('connect_error', (error) => {
                console.log('连接错误:', error);
                document.getElementById('chatError').textContent = '连接中，请稍候...';
            });

            socket.on('reconnect', (attemptNumber) => {
                console.log('重连成功，尝试次数:', attemptNumber);
                document.getElementById('chatError').textContent = '';
                
                // 重连成功后重新绑定用户
                if (currentUser) {
                    socket.emit('bindUser', {
                        userId: currentUser.id,
                        username: currentUser.username
                    });
                }
            });

            socket.on('reconnect_failed', () => {
                console.log('重连失败');
                document.getElementById('chatError').textContent = '连接失败，请刷新页面';
            });

            socket.on('bindSuccess', (data) => {
                console.log('用户绑定成功:', data);
                document.getElementById('chatError').textContent = '';
            });

            // 更新在线用户列表
            socket.on('onlineUsers', (users) => {
                updateOnlineUsersList(users);
            });

            // 接收聊天消息 - 解密后渲染
            socket.on('chat', (data) => {
                // 解密消息内容
                const decryptedContent = decryptMessage(data.content);
                data.content = decryptedContent;
                appendMessage(data);
            });

            socket.on('error', (data) => {
                console.log('WebSocket错误:', data);
                document.getElementById('chatError').textContent = data.message;
                
                setTimeout(() => {
                    document.getElementById('chatError').textContent = '';
                }, 3000);
            });

            socket.on('disconnect', () => {
                console.log('WebSocket断开连接');
                document.getElementById('chatError').textContent = '连接已断开，正在重连...';
            });
        }

        // 更新在线用户列表
        function updateOnlineUsersList(users) {
            const onlineUsersEl = document.getElementById('onlineUsers');
            const onlineCountEl = document.getElementById('onlineCount');
            
            if (!onlineUsersEl) return;
            
            onlineCountEl.textContent = users.length;
            
            if (users.length === 0) {
                onlineUsersEl.innerHTML = '<li class="empty-state">✨ 暂无其他用户在线</li>';
                return;
            }
            
            let html = '';
            users.forEach(username => {
                // 标记当前用户
                if (currentUser && username === currentUser.username) {
                    html += `
                        <li class="current-user">
                            <span class="username">${username}</span>
                            <span class="user-badge">我</span>
                        </li>
                    `;
                } else {
                    html += `
                        <li>
                            <span class="username">${username}</span>
                        </li>
                    `;
                }
            });
            onlineUsersEl.innerHTML = html;
        }

        // 加载历史消息
        async function loadHistoryMessages() {
            try {
                const response = await fetch('/api/messages/history', {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    const messagesContainer = document.getElementById('messages');
                    messagesContainer.innerHTML = '';
                    
                    data.data.forEach(msg => {
                        appendMessage(msg, false);
                    });
                    
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('加载历史消息失败:', error);
            }
        }

        // 添加消息到界面 - 使用textContent安全渲染
        function appendMessage(msg, scrollToBottom = true) {
            const messagesContainer = document.getElementById('messages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            if (msg.user && msg.user.id === currentUser?.id) {
                messageDiv.classList.add('message-self');
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'message-info';
            
            const time = new Date(msg.send_time).toLocaleTimeString();
            infoDiv.textContent = `${msg.user?.username || '未知用户'} ${time}`;

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            // 使用textContent安全渲染
            textDiv.textContent = msg.content;

            contentDiv.appendChild(infoDiv);
            contentDiv.appendChild(textDiv);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            if (scrollToBottom) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // 发送消息
        function sendMessage() {
            const msgInput = document.getElementById('msgInput');
            const content = msgInput.value.trim();

            if (!content) {
                document.getElementById('chatError').textContent = '消息内容不能为空';
                return;
            }

            if (!socket || !socket.connected) {
                document.getElementById('chatError').textContent = '连接已断开，请刷新页面';
                return;
            }

            // 发送明文，服务器会加密
            socket.emit('chat', { content });
            
            msgInput.value = '';
            document.getElementById('chatError').textContent = '';
        }

        // 回车发送消息
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 初始化WebSocket
        initWebSocket();

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/users/current', {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    currentUser = data.data;
                    document.getElementById('currentUser').textContent = currentUser.username;
                    
                    // 如果已登录，绑定WebSocket
                    socket.emit('bindUser', {
                        userId: currentUser.id,
                        username: currentUser.username
                    });
                    
                    showChatroom();
                    loadHistoryMessages();
                }
            } catch (error) {
                console.log('未登录');
            }
        }

        // 初始化检查登录状态
        checkLoginStatus();
    </script>
</body>
</html>
